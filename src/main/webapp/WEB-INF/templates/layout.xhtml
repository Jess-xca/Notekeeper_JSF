<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>NoteKeeper | <ui:insert name="title">Home</ui:insert></title>
    <h:outputStylesheet name="css/app.css"/>
    <h:outputScript name="js/lucide.min.js"/>
    <h:outputScript name="js/icons.js"/>
    <ui:insert name="head"/>
</h:head>
<h:body>
    <div class="app">
        <header class="topbar">
            <h:link outcome="home" styleClass="brand">
                <i data-lucide="notebook-pen" class="icon brand-icon"></i>
                <span class="brand-name">NoteKeeper</span>
            </h:link>
            
            <div class="topbar-center">
                <h:form styleClass="topbar-search-form">
                    <div class="topbar-search">
                        <i data-lucide="search" class="icon search-icon"></i>
                        <h:inputText value="#{searchBean.searchQuery}" 
                                     placeholder="Search pages, workspaces, tags..."
                                     styleClass="topbar-search-input">
                            <f:ajax event="keyup" render="@none" 
                                    listener="#{searchBean.search}" 
                                    onkeypress="if (event.keyCode == 13) { window.location.href = 'search.xhtml?q=' + encodeURIComponent(this.value); return false; }"/>
                        </h:inputText>
                    </div>
                </h:form>
            </div>
            
            <div class="topbar-actions">
                <button class="topbar-btn" title="Notifications">
                    <i data-lucide="bell" class="icon"></i>
                </button>
                <button class="topbar-btn" title="Profile">
                    <i data-lucide="user" class="icon"></i>
                </button>
            </div>
        </header>

        <div class="shell">
            <aside class="sidebar">
                <nav class="side-nav">
                    <h:link outcome="home"
                            styleClass="#{view.viewId == '/index.xhtml' ? 'side-link is-active' : 'side-link'}">
                        <i data-lucide="layout-dashboard" class="icon"></i>
                        <span>Dashboard</span>
                    </h:link>
                    <h:link outcome="workspaces"
                            styleClass="#{view.viewId == '/workspaces.xhtml' ? 'side-link is-active' : 'side-link'}">
                        <i data-lucide="folder" class="icon"></i>
                        <span>Workspaces</span>
                    </h:link>
                    <h:link outcome="tags"
                            styleClass="#{view.viewId == '/tags.xhtml' ? 'side-link is-active' : 'side-link'}">
                        <i data-lucide="tag" class="icon"></i>
                        <span>Tags</span>
                    </h:link>
                </nav>
            </aside>

            <main class="content">
                <ui:insert name="content"/>
            </main>
        </div>

    </div>
</h:body>
</html>
