<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Dashboard</ui:define>
    <ui:define name="head">
        <!-- Dashboard-specific styles are now in app.css -->
    </ui:define>
    <ui:define name="content">
        <section class="welcome">
            <h1>Welcome back</h1>
            <p>Here’s what’s happening with your notes today</p>
        </section>

        <section class="stats">
            <article class="card stat">
                <div class="stat-content">
                    <label>Workspaces</label>
                    <strong>#{homeBean.workspaceCount}</strong>
                    <h:link outcome="workspaces" value="View all →" styleClass="stat-link"/>
                </div>
                <div class="icon-circle">
                    <i data-lucide="folder" class="icon"></i>
                </div>
            </article>
            <article class="card stat">
                <div class="stat-content">
                    <label>Tags</label>
                    <strong>#{homeBean.tagCount}</strong>
                    <h:link outcome="tags" value="View all →" styleClass="stat-link"/>
                </div>
                <div class="icon-circle">
                    <i data-lucide="tag" class="icon"></i>
                </div>
            </article>
        </section>

        <section class="grid-2">
            <article class="card">
                <h2 style="margin-top: 0;">Recent workspaces</h2>
                <div class="list">
                    <ui:repeat value="#{homeBean.workspaces}" var="workspace">
                        <div class="list-item">
                            <i data-lucide="folder" class="icon"></i>
                            <div class="list-item-content">
                                <h3>#{workspace.name}</h3>
                                <p>#{workspace.description}</p>
                            </div>
                        </div>
                    </ui:repeat>
                    <h:outputText value="No workspaces yet" styleClass="empty"
                                  rendered="#{empty homeBean.workspaces}"/>
                </div>
            </article>

            <article class="card">
                <h2 style="margin-top: 0;">Your tags</h2>
                <div class="list">
                    <ui:repeat value="#{homeBean.tags}" var="tag">
                        <div class="list-item">
                            <span class="swatch" style="background-color: #{tag.color};"></span>
                            <div class="list-item-content">
                                <h3>#{tag.name}</h3>
                                <p>#{tag.color}</p>
                            </div>
                        </div>
                    </ui:repeat>
                    <h:outputText value="Create tags to organize your pages" styleClass="empty"
                                  rendered="#{empty homeBean.tags}"/>
                </div>
            </article>
        </section>
    </ui:define>
</ui:composition>
