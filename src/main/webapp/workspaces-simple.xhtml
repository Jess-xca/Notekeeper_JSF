<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Workspaces</ui:define>
    <ui:define name="content">
        <div class="page-head">
            <div>
                <h1>Workspaces</h1>
                <p>Group notes for school, work, or personal projects</p>
            </div>
        </div>

        <h:form>
            <h:messages globalOnly="true" styleClass="messages" infoClass="messages" errorClass="error"/>

            <section class="card form-card">
                <h2 class="form-title">New workspace</h2>
                <div class="form-grid">
                    <div class="field">
                        <h:outputLabel for="wsName" value="Name"/>
                        <h:inputText id="wsName" value="#{workspaceBean.workspace.name}" required="true"/>
                        <h:message for="wsName" styleClass="error"/>
                    </div>
                    <div class="field">
                        <h:outputLabel for="wsOwner" value="Owner"/>
                        <h:inputText id="wsOwner" value="#{workspaceBean.workspace.ownerName}" required="true"/>
                        <h:message for="wsOwner" styleClass="error"/>
                    </div>
                    <div class="field">
                        <h:outputLabel for="wsIcon" value="Icon"/>
                        <h:inputText id="wsIcon" value="#{workspaceBean.workspace.icon}"/>
                    </div>
                    <div class="field">
                        <h:outputLabel for="wsDefault" value="Default workspace"/>
                        <h:selectBooleanCheckbox id="wsDefault" value="#{workspaceBean.workspace.isDefault}"/>
                    </div>
                    <div class="field full">
                        <h:outputLabel for="wsDescription" value="Description"/>
                        <h:inputTextarea id="wsDescription" value="#{workspaceBean.workspace.description}" rows="3"/>
                    </div>
                </div>
                <div class="actions">
                    <h:commandButton value="Create workspace" action="#{workspaceBean.save}" styleClass="btn btn-primary"/>
                    <h:commandButton value="Cancel" action="#{workspaceBean.reset}" immediate="true" styleClass="btn btn-secondary"/>
                </div>
            </section>

            <section class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Workspace</th>
                            <th>Owner</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{workspaceBean.workspaces}" var="item">
                            <tr>
                                <td>
                                    <div class="workspace-name-cell">
                                        <span class="workspace-icon">#{item.icon}</span>
                                        <span class="workspace-name">#{item.name}</span>
                                        <span class="default-badge" rendered="#{item.isDefault}">
                                            <i data-lucide="check" class="icon"></i>
                                            Default
                                        </span>
                                    </div>
                                </td>
                                <td>#{item.ownerName}</td>
                                <td>#{item.description}</td>
                                <td>
                                    <div class="table-actions">
                                        <h:commandButton value="Edit" action="#{workspaceBean.edit(item)}" styleClass="btn btn-secondary"/>
                                        <h:commandButton value="Delete" action="#{workspaceBean.delete(item)}" styleClass="btn btn-danger" onclick="return confirm('Delete this workspace?');"/>
                                    </div>
                                </td>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
                <h:outputText value="No workspaces yet." styleClass="empty" rendered="#{empty workspaceBean.workspaces}"/>
            </section>
        </h:form>
    </ui:define>
</ui:composition>
