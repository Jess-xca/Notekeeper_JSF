<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8"/>
    <title>NoteKeeper | Tag CRUD</title>
    <h:outputStylesheet name="css/app.css"/>
    <!-- Internal CSS for this page only -->
    <style>
        .tag-form-title {
            margin-top: 0;
        }
        .color-hint {
            font-size: 0.82rem;
            color: #475569;
        }
    </style>
</h:head>
<h:body>
    <div class="nk-shell">
        <header class="nk-header">
            <div class="nk-brand">
                <h1>Tag CRUD</h1>
                <p>Create, read, update, and delete NoteKeeper tags</p>
            </div>
            <nav class="nk-nav">
                <h:link outcome="home" value="Home"/>
                <h:link outcome="workspaces" value="Workspaces"/>
            </nav>
        </header>

        <h:form id="tagForm">
            <h:messages globalOnly="true" styleClass="nk-messages" infoClass="nk-messages" errorClass="nk-error"/>

            <section class="nk-card">
                <h2 class="tag-form-title">#{tagBean.editing ? 'Update Tag' : 'Create Tag'}</h2>
                <div class="nk-form-grid">
                    <div class="nk-field">
                        <h:outputLabel for="tagName" value="Tag name *"/>
                        <h:inputText id="tagName" value="#{tagBean.tag.name}" required="true"
                                     requiredMessage="Tag name is required.">
                            <!-- JSF built-in validators -->
                            <f:validateLength minimum="2" maximum="50"/>
                            <f:validateRegex pattern="[A-Za-z0-9][A-Za-z0-9\s-]*"/>
                            <!-- Custom validator -->
                            <f:validator validatorId="uniqueTagNameValidator"/>
                            <f:attribute name="currentId" value="#{tagBean.tag.id}"/>
                        </h:inputText>
                        <h:message for="tagName" styleClass="nk-error"/>
                    </div>

                    <div class="nk-field">
                        <h:outputLabel for="tagColor" value="Hex color *"/>
                        <h:inputText id="tagColor" value="#{tagBean.tag.color}" required="true"
                                     requiredMessage="Tag color is required.">
                            <f:validateLength minimum="7" maximum="7"/>
                            <f:validateRegex pattern="#[A-Fa-f0-9]{6}"/>
                            <f:validator validatorId="hexColorValidator"/>
                        </h:inputText>
                        <span class="color-hint">Example: #2563EB</span>
                        <h:message for="tagColor" styleClass="nk-error"/>
                    </div>
                </div>

                <div class="nk-actions">
                    <h:commandButton value="#{tagBean.editing ? 'Update Tag' : 'Save Tag'}"
                                     action="#{tagBean.save}" styleClass="nk-btn nk-btn-primary"/>
                    <h:commandButton value="Clear" action="#{tagBean.reset}" immediate="true"
                                     styleClass="nk-btn nk-btn-secondary"/>
                </div>
            </section>

            <section class="nk-card">
                <h2 style="margin-top: 0;">All Tags</h2>
                <h:dataTable value="#{tagBean.tags}" var="item" styleClass="nk-table"
                             rendered="#{not empty tagBean.tags}">
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        <span class="nk-swatch" style="background-color: #{item.color};"></span>
                        <h:outputText value="#{item.name}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Color</f:facet>
                        <h:outputText value="#{item.color}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Created</f:facet>
                        <h:outputText value="#{item.createdAt}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="Edit" action="#{tagBean.edit(item)}"
                                         styleClass="nk-btn nk-btn-secondary"/>
                        <h:commandButton value="Delete" action="#{tagBean.delete(item)}"
                                         styleClass="nk-btn nk-btn-danger"
                                         onclick="return confirm('Delete this tag?');"/>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No tags yet. Create the first tag above."
                              rendered="#{empty tagBean.tags}"/>
            </section>
        </h:form>
    </div>
</h:body>
</html>
