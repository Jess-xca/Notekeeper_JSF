<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Tags</ui:define>
    <ui:define name="head">
        <!-- Internal CSS (Phase-1 requirement): page-local form polish -->
        <style type="text/css">
            .form-title { letter-spacing: -0.02em; }
            .color-hint { display: block; margin-top: 0.35rem; color: #6b7280; font-size: 0.8125rem; }
        </style>
    </ui:define>
    <ui:define name="content">
        <div class="page-head">
            <div>
                <h1>Tags</h1>
                <p>Label your notes so they stay easy to find</p>
            </div>
        </div>

        <h:form id="tagForm">
            <h:messages globalOnly="true" styleClass="messages" errorClass="error"/>

            <section class="card form-card">
                <h2 class="form-title">#{tagBean.editing ? 'Edit tag' : 'New tag'}</h2>
                <div class="form-grid">
                    <div class="field">
                        <h:outputLabel for="tagName" value="Name"/>
                        <h:inputText id="tagName" value="#{tagBean.tag.name}" required="true"
                                     requiredMessage="Tag name is required.">
                            <f:validateLength minimum="2" maximum="50"/>
                            <f:validateRegex pattern="[A-Za-z0-9][A-Za-z0-9\s-]*"/>
                            <f:validator validatorId="uniqueTagNameValidator"/>
                            <f:attribute name="currentId" value="#{tagBean.tag.id}"/>
                        </h:inputText>
                        <h:message for="tagName" styleClass="error"/>
                    </div>
                    <div class="field">
                        <h:outputLabel for="tagColor" value="Color"/>
                        <h:inputText id="tagColor" value="#{tagBean.tag.color}" required="true"
                                     requiredMessage="Tag color is required."
                                     styleClass="color-input">
                            <f:validateLength minimum="7" maximum="7"/>
                            <f:validateRegex pattern="^#[A-Fa-f0-9]{6}$"/>
                        </h:inputText>
                        <span class="color-hint">Use a hex color such as #4F46E5</span>
                        <h:message for="tagColor" styleClass="error"/>
                    </div>
                </div>
                <div class="actions">
                    <h:commandButton value="#{tagBean.editing ? 'Save changes' : 'Create tag'}"
                                     action="#{tagBean.save}" styleClass="btn btn-primary"/>
                    <h:commandButton value="Cancel" action="#{tagBean.reset}" immediate="true"
                                     styleClass="btn btn-secondary"/>
                </div>
            </section>

            <section class="card">
                <h:dataTable value="#{tagBean.tags}" var="item" styleClass="table"
                             rendered="#{not empty tagBean.tags}">
                    <h:column>
                        <f:facet name="header">Tag</f:facet>
                        <div class="table-tag-cell">
                            <span class="swatch" style="background-color: #{item.color};"></span>
                            <h:outputText value="#{item.name}"/>
                        </div>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Color</f:facet>
                        <h:outputText value="#{item.color}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <div class="table-actions">
                            <h:commandButton value="Edit" action="#{tagBean.edit(item)}"
                                             styleClass="btn btn-secondary"
                                             immediate="true"/>
                            <h:commandButton value="Delete" action="#{tagBean.delete(item)}"
                                             styleClass="btn btn-danger"
                                             immediate="true"
                                             onclick="return confirm('Delete this tag?');"/>
                        </div>
                    </h:column>
                </h:dataTable>
                <h:outputText value="No tags yet. Create one to organize your pages."
                              styleClass="empty" rendered="#{empty tagBean.tags}"/>
            </section>
        </h:form>
    </ui:define>
</ui:composition>
