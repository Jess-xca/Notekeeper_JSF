<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired - NoteKeeper</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            margin: 0 0 16px 0;
            font-size: 1.875rem;
            font-weight: 700;
            color: #1e40af;
        }
        p {
            margin: 0 0 24px 0;
            color: #64748b;
        }
        .btn {
            display: inline-block;
            background: #1e40af;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #1e3a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Session Expired</h1>
            <p>Your session has expired or the page could not be restored.</p>
            <p>Please return to the home page to continue.</p>
            <a href="index.xhtml" class="btn">Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
